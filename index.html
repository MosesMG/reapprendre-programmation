<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un parcours structuré et progressif pour reprendre la programmation sur de bonnes bases."
    />
    <meta name="theme-color" content="#05060c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(() => {
        try {
          const key = 'tuto-code-theme'
          const stored = window.localStorage.getItem(key)
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'

          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme

          const meta = document.querySelector('meta[name="theme-color"]')
          meta?.setAttribute(
            'content',
            theme === 'dark' ? '#05060c' : '#f6f7fb',
          )
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Réapprendre la programmation · Parcours dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
